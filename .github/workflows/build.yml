name: CI Build Check

# Workflow ini HANYA untuk memastikan template Android masih bisa di-compile
# setiap ada perubahan (push/PR). Ini bukan yang dipakai bot Telegram —
# untuk build APK sesuai permintaan user, lihat web2apk.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK (sanity check)
        run: ./gradlew assembleDebug

      - name: Upload artifact (untuk debugging manual jika perlu)
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/**/*.apk
          
