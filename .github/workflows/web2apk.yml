name: Build APK (Web2APK)

# Workflow ini dipicu manual (workflow_dispatch), biasanya lewat GitHub API
# yang dipanggil dari bot Telegram (lihat telegram_bot.py).
#
# request_id dipakai untuk mengaitkan run ini dengan permintaan dari bot:
# - muncul di nama run (run-name) agar bot bisa mencari run yang sesuai
# - dipakai sebagai tag release agar bot bisa mengambil file APK hasil build

run-name: "APK Build: ${{ inputs.app_name }} (${{ inputs.request_id }})"

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL website yang akan dibungkus jadi APK"
        required: true
        type: string
      app_name:
        description: "Nama aplikasi yang tampil di HP"
        required: true
        type: string
      package_name:
        description: "Package name Android (opsional, kosongkan jika pakai default template)"
        required: false
        type: string
        default: ""
      request_id:
        description: "ID unik dari bot untuk melacak build ini"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # perlu untuk membuat release + upload asset
    steps:
      - name: Checkout template
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ======================================================================
      # SESUAIKAN BAGIAN INI dengan struktur project template Anda.
      # Asumsi default: URL & nama app disimpan di app/src/main/res/values/strings.xml
      # dengan placeholder PLACEHOLDER_URL dan PLACEHOLDER_APP_NAME.
      # ======================================================================
      - name: Inject URL & App Name ke template
        run: |
          STRINGS_FILE="app/src/main/res/values/strings.xml"
          sed -i "s|PLACEHOLDER_URL|${{ inputs.url }}|g" "$STRINGS_FILE"
          sed -i "s|PLACEHOLDER_APP_NAME|${{ inputs.app_name }}|g" "$STRINGS_FILE"

      - name: Set package name (opsional)
        if: ${{ inputs.package_name != '' }}
        run: |
          # Contoh sederhana ganti applicationId di app/build.gradle.
          # Sesuaikan path/pattern jika struktur template berbeda.
          sed -i "s|applicationId \".*\"|applicationId \"${{ inputs.package_name }}\"|g" app/build.gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (debug, tanpa signing)
        run: ./gradlew assembleDebug

      - name: Cari file APK hasil build
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Buat Release + upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.request_id }}
          name: "${{ inputs.app_name }} - ${{ inputs.request_id }}"
          files: ${{ steps.find_apk.outputs.apk_path }}
          
